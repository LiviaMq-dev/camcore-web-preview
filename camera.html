<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CamCore</title>
  <link rel="icon" href="static/imagens.img/Logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="static/css/camera.css">
  <link rel="stylesheet" href="preview.css">
</head>

<body>
<div class="preview-notice" role="note"><strong>Prévia web do CamCore</strong><span>Explore as telas. IA, contas e dados reais exigem o servidor do projeto.</span><a href="https://github.com/mmmaryae/capacete" target="_blank" rel="noopener noreferrer">Ver código</a></div>

  <header class="navbar">
    <div class="logo-area">
      <img src="static/imagens.img/Logo.png" class="logo-icon" >
      <span class="logo-text">CamCore</span>
    </div>

    <nav class="nav-botoes" id="menuDesktop">
      <a href="relatorio.html" class="nav-btn">Relatórios</a>
      <a href="index.html" class="nav-btn">Início</a>
    </nav>

    <div class="menu-toggle" id="menuToggle">
        ☰
    </div>

    
  </header>



  <section class="hero" id="inicio">
    <div class="container-camera">
      <div class="camera-box" id="cameraBox">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas" style="display: none;"></canvas>

        <div id="alertaViolacao" class="alerta-overlay">
          <p>VIOLAÇÃO REGISTRADA</p>
          <button id="btnOkAlerta" class="btn-ok-alerta">OK</button>
        </div>

        <div id="status">Visualização da interface</div>
      </div>

      <button id="btnCamera" class="btn-camera" disabled>
        <span class="icon-camera">📷</span>
        <span id="btnText">Câmera indisponível na prévia</span>
      </button>
    </div>
  </section>

  
</body>
</html>
